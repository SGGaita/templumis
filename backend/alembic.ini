[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# New revision:
#   docker compose exec backend alembic revision --autogenerate -m "describe the change"
# Apply:
#   docker compose exec backend python manage.py migrate
#   (or) docker compose exec backend alembic upgrade head

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
